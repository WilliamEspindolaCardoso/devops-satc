apiVersion: apps/v1
kind: Deployment

metadata:
  name: app-satc
  namespace: ##K8S_NAMESPACE##
  labels:
    app: app-satc

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: app-satc

  template:
    metadata:
      labels:
        app: app-satc

    spec:
      containers:
        - name: app-satc
          image: docker.io/##DOCKER_USERNAME##/satc-devops:##K8S_TAG##

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5173

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service

metadata:
  name: app-satc
  namespace: ##K8S_NAMESPACE##
  labels:
    app: app-satc

spec:
  type: ClusterIP

  selector:
    app: app-satc

  ports:
    - name: http
      port: 80
      targetPort: 5173
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: app-satc
  namespace: ##K8S_NAMESPACE##

spec:
  ingressClassName: nginx

  rules:
    - host: ##DOCKER_USERNAME##.app.devops-satc.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-satc
                port:
                  number: 80